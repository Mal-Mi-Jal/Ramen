spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-init-sql: "SET default_transaction_read_only = off"
      auto-commit: true


  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        connection:
          provider_disables_autocommit: false

kakao:
  api:
    key: ${KAKAO_API_KEY}

jwt:
  secret: ${JWT_SECRET}

verification:
  required-stay-seconds: 30