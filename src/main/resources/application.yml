spring:
  datasource:
    url: jdbc:h2:mem:ramen_db;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

kakao:
  api:
    key: 7e32bbba57af7809711f1088abed46fd

verification:
  required-stay-seconds: 30